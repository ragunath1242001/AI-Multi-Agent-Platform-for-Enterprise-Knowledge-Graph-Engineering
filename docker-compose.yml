services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
    ports:
      - "3001:3000"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://semanticops:semanticops@postgres:5432/semanticops
      FUSEKI_URL: http://fuseki:3030/semanticops
      KNOWLEDGE_ASSETS_DIR: /app/kg
      CORS_ORIGINS: '["http://localhost:3001"]'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
    ports:
      - "8001:8000"
    volumes:
      - ./kg:/app/kg:ro
    depends_on:
      postgres:
        condition: service_healthy
      fuseki:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: semanticops
      POSTGRES_USER: semanticops
      POSTGRES_PASSWORD: semanticops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semanticops -d semanticops"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  fuseki:
    image: stain/jena-fuseki:latest
    environment:
      ADMIN_PASSWORD: semanticops
      FUSEKI_DATASET_1: semanticops
    ports:
      - "3031:3030"
    volumes:
      - fuseki-data:/fuseki

volumes:
  postgres-data:
  fuseki-data:
