[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticops-agents"
version = "0.1.0"
description = "LangGraph multi-agent orchestration for SemanticOps."
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-core>=0.2.0",
  "pydantic>=2.8.0",
  "rdflib>=7.0.0",
  "pyshacl>=0.26.0",
  "owlready2>=0.46"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.9"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.setuptools.packages.find]
where = ["."]
include = ["semanticops_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
